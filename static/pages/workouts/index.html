<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Prep — Workouts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/base.css">
</head>

<body>
    <main class="app-main">
        <div id="page-workouts">
            <section class="page-h">
                <div>
                    <h1>Workouts</h1>
                    <p class="page-desc">Log circuit and straight-set workouts. Track date, duration, and what you did.</p>
                    <div class="topbar-actions" id="workouts-action-bar">
                        <button id="workout-new-btn" type="button" class="btn btn-primary" onclick="openWorkoutForm()">
                            Create Workout
                        </button>
                    </div>
                </div>
            </section>

            <section id="workouts-loading" class="loading-state hidden">
                <div class="spinner"></div>
                <p>Loading workouts…</p>
            </section>

            <section id="templates-section" class="templates-section hidden">
                <h2 class="templates-h">Saved templates</h2>
                <div id="templates-list" class="templates-list"></div>
            </section>

            <section id="workouts-empty" class="workouts-empty hidden">
                <p>No workouts logged yet. Click <b>Create Workout</b> to add your first one.</p>
            </section>

            <section id="workouts-logs-section" class="workouts-logs-section hidden">
                <h2 class="workouts-logs-h">Workout logs</h2>
                <div id="workouts-list" class="workouts-list"></div>
            </section>
        </div><!-- /#page-workouts -->

        <!-- Workout Log/Edit Modal -->
        <div id="workout-modal" class="modal hidden">
            <div class="modal-content large-modal">
                <div class="modal-header">
                    <h2 id="workout-modal-title">Log Workout</h2>
                    <button onclick="closeWorkoutModal()" class="btn-close" type="button">&times;</button>
                </div>

                <form id="workout-form" onsubmit="saveWorkout(event)">
                    <div id="template-picker-wrap" class="form-group hidden">
                        <label for="template-picker">Start from template</label>
                        <select id="template-picker" class="form-control" onchange="loadTemplateIntoForm(this.value)">
                            <option value="">— blank workout —</option>
                        </select>
                    </div>

                    <div class="workout-form-meta">
                        <div class="form-group">
                            <label for="workout-name" id="workout-name-label">Name (optional)</label>
                            <input type="text" id="workout-name" class="form-control" placeholder="e.g., Saturday circuit">
                        </div>
                        <div class="form-group" id="workout-date-group">
                            <label for="workout-date">Date</label>
                            <input type="date" id="workout-date" class="form-control" required>
                        </div>
                        <div class="form-group" id="workout-duration-group">
                            <label for="workout-duration">Duration (mm:ss)</label>
                            <input type="text" id="workout-duration" class="form-control"
                                   placeholder="25:00" pattern="\d{1,3}:\d{2}" required>
                        </div>
                    </div>

                    <h4 class="mt-4">Blocks</h4>
                    <div id="workout-blocks" class="workout-blocks"></div>
                    <button type="button" onclick="addBlock()" class="btn btn-secondary btn-sm mt-2">+ Add Block</button>

                    <div class="form-group mt-4" id="workout-notes-group">
                        <label for="workout-notes">Notes (optional)</label>
                        <textarea id="workout-notes" class="form-control" rows="2"></textarea>
                    </div>

                    <div class="form-actions mt-4">
                        <button type="button" onclick="closeWorkoutModal()" class="btn btn-secondary">Cancel</button>
                        <button type="button" id="save-as-template-btn" onclick="openSaveTemplateDialog()" class="btn btn-secondary">Save as Template</button>
                        <button type="submit" id="workout-form-submit" class="btn btn-primary">Save Workout</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Workout Detail Modal -->
        <div id="workout-detail-modal" class="modal hidden">
            <div class="modal-content large-modal">
                <div class="modal-header">
                    <h2 id="workout-detail-title">Workout</h2>
                    <button onclick="closeModal('workout-detail-modal')" class="btn-close" type="button">&times;</button>
                </div>
                <div id="workout-detail-body"></div>
                <div class="form-actions mt-4">
                    <button type="button" onclick="editCurrentWorkout()" class="btn btn-secondary">Edit</button>
                    <button type="button" onclick="deleteCurrentWorkout()" class="btn btn-danger">Delete</button>
                    <button type="button" onclick="closeModal('workout-detail-modal')" class="btn btn-primary">Close</button>
                </div>
            </div>
        </div>

        <!-- Save Template Name Modal -->
        <div id="template-name-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="template-name-modal-title">Save as Template</h2>
                    <button onclick="closeModal('template-name-modal')" class="btn-close" type="button">&times;</button>
                </div>
                <form id="template-name-form" onsubmit="saveTemplate(event)">
                    <div class="form-group">
                        <label for="template-name-input">Template name</label>
                        <input type="text" id="template-name-input" class="form-control" required
                               placeholder="e.g., Hero circuit">
                    </div>
                    <div class="form-actions mt-4">
                        <button type="button" onclick="closeModal('template-name-modal')" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Template</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Template Detail Modal -->
        <div id="template-detail-modal" class="modal hidden">
            <div class="modal-content large-modal">
                <div class="modal-header">
                    <h2 id="template-detail-title">Template</h2>
                    <button onclick="closeModal('template-detail-modal')" class="btn-close" type="button">&times;</button>
                </div>
                <div id="template-detail-body"></div>
                <div class="form-actions mt-4">
                    <button type="button" onclick="useCurrentTemplate()" class="btn btn-secondary">Use for new workout</button>
                    <button type="button" onclick="editCurrentTemplate()" class="btn btn-secondary">Edit</button>
                    <button type="button" onclick="deleteCurrentTemplate()" class="btn btn-danger">Delete</button>
                    <button type="button" onclick="closeModal('template-detail-modal')" class="btn btn-primary">Close</button>
                </div>
            </div>
        </div>

        <!-- Toast notification (shared, but each page renders its own instance) -->
        <div id="toast" class="hidden"></div>
    </main>

    <script src="/shared/chrome.js"></script>
    <script>mountChrome({ activePage: 'workouts', crumbLabel: 'Workouts', weekLabel: 'Log' });</script>
    <script src="/pages/workouts/workouts.js"></script>
</body>

</html>
